services:
  postgres:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    environment:
      POSTGRES_USER: ai_ops
      POSTGRES_DB: ai_ops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run start-docker.cmd to generate the local database password}
    volumes:
      - postgres-v2-data:/var/lib/postgresql
    networks: [storage]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_ops -d ai_ops"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run start-docker.cmd to generate the local Redis password}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Run start-docker.cmd to generate the local Redis password}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\" --maxmemory 256mb --maxmemory-policy noeviction"]
    volumes:
      - redis-v2-data:/data
    networks: [storage]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4175
      PLATFORM_DB_PATH: /app/data/platform.sqlite
      DATABASE_URL: postgresql://ai_ops:${POSTGRES_PASSWORD}@postgres:5432/ai_ops
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      AI_OPS_DB_POOL_SIZE: ${AI_OPS_DB_POOL_SIZE:-20}
      AI_OPS_GATEWAY_CONCURRENCY: ${AI_OPS_GATEWAY_CONCURRENCY:-200}
      AI_OPS_EMPLOYEE_CONCURRENCY: ${AI_OPS_EMPLOYEE_CONCURRENCY:-4}
      AI_OPS_PROVIDER_CONCURRENCY: ${AI_OPS_PROVIDER_CONCURRENCY:-12}
      AI_OPS_EMPLOYEE_RPM: ${AI_OPS_EMPLOYEE_RPM:-120}
      AI_OPS_MAX_WAITING: ${AI_OPS_MAX_WAITING:-100}
      AI_OPS_RELAY_MAX_ATTEMPTS: ${AI_OPS_RELAY_MAX_ATTEMPTS:-3}
      AUTH_MODE: required
      AUTH_ADMIN_USERNAME: ${AUTH_ADMIN_USERNAME:?Set AUTH_ADMIN_USERNAME in the local .env file}
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD:?Set AUTH_ADMIN_PASSWORD in the local .env file}
      AUTH_ADMIN_DISPLAY_NAME: ${AUTH_ADMIN_DISPLAY_NAME:-超级管理员}
      AI_OPS_PUBLIC_WEB_BASE_URL: ${AI_OPS_PUBLIC_WEB_BASE_URL:-http://127.0.0.1:4174}
      AI_OPS_CORS_ORIGINS: ${AI_OPS_CORS_ORIGINS:-}
      AI_OPS_COOKIE_SECURE: ${AI_OPS_COOKIE_SECURE:-true}
      AI_OPS_KEY_ENCRYPTION_SECRET: ${AI_OPS_KEY_ENCRYPTION_SECRET:?Set AI_OPS_KEY_ENCRYPTION_SECRET in the local .env file}
      AI_OPS_AUDIT_ENCRYPTION_SECRET: ${AI_OPS_AUDIT_ENCRYPTION_SECRET:?Set AI_OPS_AUDIT_ENCRYPTION_SECRET in the local .env file}
      AI_OPS_PUBLIC_GATEWAY_BASE_URL: ${AI_OPS_PUBLIC_GATEWAY_BASE_URL:-http://127.0.0.1:4175}
      AI_OPS_GATEWAY_MODE: relay
      AI_OPS_GATEWAY_TIMEOUT_MS: ${AI_OPS_GATEWAY_TIMEOUT_MS:-60000}
      AI_OPS_GATEWAY_DEFAULT_STREAMING: ${AI_OPS_GATEWAY_DEFAULT_STREAMING:-false}
      AI_OPS_CONTEXT_OPTIMIZATION_ENABLED: ${AI_OPS_CONTEXT_OPTIMIZATION_ENABLED:-true}
      AI_OPS_CONTEXT_MAX_INPUT_CHARS: ${AI_OPS_CONTEXT_MAX_INPUT_CHARS:-48000}
      AI_OPS_CONTEXT_MAX_MESSAGES: ${AI_OPS_CONTEXT_MAX_MESSAGES:-24}
      AI_OPS_RELAY_PROBE_FANOUT: ${AI_OPS_RELAY_PROBE_FANOUT:-3}
      AI_OPS_EXTERNAL_PROVIDER_ALLOWED_HOSTS: ${AI_OPS_EXTERNAL_PROVIDER_ALLOWED_HOSTS:-}
      AI_OPS_EXTERNAL_PROVIDERS_FILE: /app/data/external-providers.json
      AI_OPS_ALLOW_INSECURE_EXTERNAL_PROVIDER: ${AI_OPS_ALLOW_INSECURE_EXTERNAL_PROVIDER:-false}
    ports:
      # Keep the first installation local-only. The launcher can switch this
      # to 0.0.0.0 for a trusted LAN deployment.
      - "${AI_OPS_BIND_ADDRESS:-127.0.0.1}:${AI_OPS_GATEWAY_PORT:-4175}:4175"
    volumes:
      - platform-data:/app/data
    networks: [default, storage]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 90s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4175/health').then((r)=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  web:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    environment:
      NODE_ENV: production
      VITE_BFF_URL: http://server:4175
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${AI_OPS_BIND_ADDRESS:-127.0.0.1}:${AI_OPS_WEB_PORT:-4174}:4174"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4174/').then((r)=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  platform-data:
  postgres-v2-data:
  redis-v2-data:

networks:
  storage:
    internal: true
